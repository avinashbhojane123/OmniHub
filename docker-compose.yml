version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: safeguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeguard
      POSTGRES_PASSWORD: safeguard_secret_password
      POSTGRES_DB: safeguard_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safeguard -d safeguard_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safeguard_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: safeguard_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://safeguard:safeguard_secret_password@postgres:5432/safeguard_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: strong_jwt_access_secret_key_12345
      JWT_REFRESH_SECRET: strong_jwt_refresh_secret_key_67890
    ports:
      - '5000:5000'

volumes:
  postgres_data:
  redis_data:
